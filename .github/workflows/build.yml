name: Build Yanis Vision firmware

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          clean: true

      - name: Clean any stuck artifacts before build
        run: |
          sudo chmod -R 777 . || true
          sudo rm -rf managed_components build sdkconfig ~/.esp-idf-cache || true

      - name: Build ESP-IDF project
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5
          target: esp32

      - name: Unlock permissions after build
        run: |
          sudo chown -R $USER:$USER .
          sudo chmod -R 777 .

      - name: Copy binaries to installer folder
        run: |
          mkdir -p web_installer/firmware
          cp build/yanis_vision.bin web_installer/firmware/app.bin

      - name: Commit and push binaries
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add web_installer/firmware/app.bin
          git commit -m "Auto-build firmware binaries" || exit 0
          git stash
          git pull --rebase origin main
          git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git HEAD:${{ github.ref }}
